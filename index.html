<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURORA - Hồi Ức 7 Năm</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:ital,wght@0,300;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* --- CSS STYLING --- */
        :root {
            --aurora-cyan: #48CAE4;
            --aurora-light: #CAF0F8;
            --bg-top: #020b18; 
            --bg-mid: #0a2442;
            --bg-bottom: #145973; 
            --accent-yellow: #FFD166; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 40%, var(--bg-bottom) 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto; 
            position: relative;
            padding-bottom: 120px; /* Chừa không gian cho cổng Parabol ở đáy */
        }

        /* Khung chứa các lớp nền hiệu ứng kỹ thuật số */
        .background-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        canvas {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }

        /* Đồi núi trập trùng miền Trung ở phía chân trời */
        .mountains {
            position: fixed;
            bottom: 60px; left: 0; width: 100%; height: 180px;
            background: repeat-x bottom;
            background-image: 
                radial-gradient(ellipse at 30% 130%, #07192e 30%, transparent 70%),
                radial-gradient(ellipse at 70% 140%, #0c2b4e 40%, transparent 70%),
                radial-gradient(ellipse at 50% 120%, #051324 35%, transparent 65%);
            background-size: 800px 200px;
            opacity: 0.85;
            z-index: 1;
            pointer-events: none;
        }

        /* --- CỔNG PARABOL BÁCH KHOA NGHỆ THUẬT --- */
        .parabol-gate {
            position: fixed;
            bottom: 0; right: 8%;
            width: 240px; height: 120px;
            z-index: 2;
            pointer-events: none;
            filter: drop-shadow(0 0 15px rgba(72, 202, 228, 0.4));
        }

        /* Sợi dây Parabol mảnh dẻ phát sáng màu cyan */
        .parabol-arch {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 100%;
            border: 3px solid var(--aurora-cyan);
            border-bottom: none;
            border-top-left-radius: 50% 100%;
            border-top-right-radius: 50% 100%;
            background: linear-gradient(to top, rgba(72, 202, 228, 0.1), transparent);
        }

        .gate-label {
            position: absolute;
            bottom: 15px; left: 50%;
            transform: translateX(-50%);
            font-size: 0.65rem;
            letter-spacing: 1.5px;
            color: var(--aurora-light);
            text-transform: uppercase;
            font-weight: 700;
            white-space: nowrap;
            opacity: 0.8;
            border: 1px solid rgba(202, 240, 248, 0.3);
            padding: 3px 8px;
            background: rgba(2, 11, 24, 0.6);
            border-radius: 4px;
        }

        header { text-align: center; margin-top: 40px; z-index: 3; position: relative; }
        h1 {
            font-family: 'Great Vibes', cursive; font-size: 6.5rem; color: #ffffff; font-weight: normal; line-height: 1;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8), 0 0 25px var(--aurora-cyan), 0 0 50px var(--aurora-cyan);
            margin-bottom: 5px; letter-spacing: 5px;
        }
        header p { font-size: 1.1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; color: var(--aurora-light); line-height: 1.6; }

        /* Cuốn sách Hologram */
        .book-wrapper {
            position: relative; width: 90%; max-width: 800px; margin: 30px auto; z-index: 3;
            display: flex; align-items: center; justify-content: center;
        }

        .book-page {
            background: rgba(10, 36, 66, 0.35); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(72, 202, 228, 0.4); border-radius: 20px; padding: 45px 40px 35px 40px;
            width: 100%; min-height: 440px; max-height: 650px;
            box-shadow: 0 0 40px rgba(72, 202, 228, 0.2), inset 0 0 20px rgba(202, 240, 248, 0.05);
            display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
            transition: opacity 0.5s ease-in-out;
        }

        /* Khung Album Slide */
        .image-slider-container {
            position: relative; width: 80%; max-width: 450px; height: 230px; margin-bottom: 20px;
            border-radius: 12px; border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); overflow: hidden; display: none; flex-shrink: 0;
        }

        .page-img { width: 100%; height: 100%; object-fit: cover; }

        .slider-btn {
            position: absolute; top: 50%; transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.5); border: none; color: #fff;
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
            display: flex; justify-content: center; align-items: center; font-size: 0.9rem;
            transition: 0.3s; z-index: 5;
        }
        .slider-btn:hover { background: var(--aurora-cyan); color: #020b18; box-shadow: 0 0 10px var(--aurora-cyan); }
        .slider-prev { left: 10px; }
        .slider-next { right: 10px; }
        
        .slider-indicator {
            position: absolute; bottom: 8px; right: 12px; background: rgba(0,0,0,0.6);
            padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; color: var(--aurora-light); z-index: 5;
        }

        .page-text-container { width: 100%; max-height: 200px; overflow-y: auto; margin-bottom: 15px; padding: 0 10px; }
        .page-text-container::-webkit-scrollbar { width: 5px; }
        .page-text-container::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); }
        .page-text-container::-webkit-scrollbar-thumb { background: var(--aurora-cyan); border-radius: 10px; }

        .page-text { font-size: 1.25rem; line-height: 1.7; font-style: italic; color: #f8f9fa; white-space: pre-wrap; }
        .page-author { font-size: 1.1rem; color: var(--accent-yellow); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }

        /* Điều hướng cuốn sách */
        .nav-btn {
            background: rgba(72, 202, 228, 0.1); border: 1px solid rgba(72, 202, 228, 0.3); color: var(--aurora-light);
            width: 50px; height: 50px; border-radius: 50%; font-size: 1.5rem; cursor: pointer;
            position: absolute; top: 50%; transform: translateY(-50%); transition: all 0.3s;
            display: flex; justify-content: center; align-items: center; z-index: 4;
        }
        .nav-btn:hover { background: rgba(72, 202, 228, 0.3); box-shadow: 0 0 20px var(--aurora-cyan); color: #fff; }
        .prev-btn { left: -25px; }
        .next-btn { right: -25px; }

        .page-indicator { margin-top: 10px; font-size: 0.9rem; color: var(--aurora-light); opacity: 0.7; z-index: 3; }
        
        .add-btn {
            margin-top: 20px; background: transparent; color: var(--aurora-light); font-weight: 600;
            padding: 12px 30px; border: 2px solid var(--aurora-cyan); border-radius: 30px; cursor: pointer;
            transition: 0.3s; z-index: 3; text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0;
            position: relative;
        }
        .add-btn:hover { background: rgba(72, 202, 228, 0.2); box-shadow: 0 0 25px rgba(72, 202, 228, 0.6); color: #fff; }

        /* Modal Popup */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 11, 24, 0.85); backdrop-filter: blur(8px); z-index: 10; justify-content: center; align-items: center;
        }
        .modal-content {
            background: var(--bg-mid); padding: 30px; border-radius: 15px; width: 90%; max-width: 500px;
            border: 1px solid var(--aurora-cyan); box-shadow: 0 0 30px rgba(72, 202, 228, 0.2);
        }
        .modal-content h2 { margin-bottom: 20px; color: var(--accent-yellow); text-align: center;}
        input, textarea { 
            width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; 
            border: 1px solid rgba(72, 202, 228, 0.3); background: rgba(0,0,0,0.3); color: #fff; outline: none;
        }
        input:focus, textarea:focus { border-color: var(--aurora-cyan); box-shadow: 0 0 10px rgba(72, 202, 228, 0.2); }
        .modal-actions { display: flex; justify-content: space-between; gap: 15px; }
        .cancel-btn { flex: 1; background: transparent; color: #fff; padding: 10px; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; cursor: pointer; }
        .cancel-btn:hover { background: rgba(255,255,255,0.1); }
        .submit-btn { flex: 1; background: var(--aurora-cyan); color: #020b18; padding: 10px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .submit-btn:hover { box-shadow: 0 0 15px var(--aurora-cyan); }
    </style>
</head>
<body>

    <div class="background-container">
        <canvas id="skyCanvas"></canvas>
    </div>
    <div class="mountains"></div>

    <div class="parabol-gate">
        <div class="parabol-arch"></div>
        <div class="gate-label">Đại học Bách Khoa Hà Nội</div>
    </div>

    <header>
        <h1>Aurora</h1>
        <p>Lễ kỉ niệm 7 năm thành lập<br>Đội SVTN Đồng hương Nghệ Tĩnh - ĐHBK Hà Nội</p>
    </header>

    <div class="book-wrapper">
        <button class="nav-btn prev-btn" onclick="turnPage(-1)">&#10094;</button>
        
        <div class="book-page" id="bookPage">
            <div class="image-slider-container" id="sliderContainer">
                <button class="slider-btn slider-prev" onclick="changeSlide(-1)">&#10094;</button>
                <img src="" id="displayImg" class="page-img" alt="Ký ức">
                <button class="slider-btn slider-next" onclick="changeSlide(1)">&#10095;</button>
                <div class="slider-indicator" id="sliderIndicator">1/1</div>
            </div>

            <div class="page-text-container">
                <div id="displayText" class="page-text">Chưa có trang kí ức nào được viết.<br>Hãy là người đầu tiên thắp sáng Aurora!</div>
            </div>
            <div id="displayAuthor" class="page-author"></div>
        </div>

        <button class="nav-btn next-btn" onclick="turnPage(1)">&#10095;</button>
    </div>

    <div class="page-indicator" id="pageIndicator">Trang 0 / 0</div>

    <button class="add-btn" onclick="openModal()">Viết Trang Mới</button>

    <div class="modal" id="inputModal">
        <div class="modal-content">
            <h2>Gửi gắm kí ức</h2>
            <form id="storyForm">
                <input type="text" id="author" placeholder="Tên hoặc biệt danh..." required>
                <textarea id="story" rows="4" placeholder="Kể lại kỉ niệm, hoặc gửi lời chúc..." required></textarea>
                <input type="file" id="imageUpload" accept="image/*" multiple>
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="submit-btn">Lưu vào sách</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <script>
        // --- CƠ CHẾ CANVAS VẼ CỰC QUANG & SAO RƠI SIÊU MƯỢT ---
        const canvas = document.getElementById('skyCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Khởi tạo đốm sao lấp lánh nền
        const starsArray = [];
        for (let i = 0; i < 100; i++) {
            starsArray.push({
                x: Math.random() * width,
                y: Math.random() * height * 0.7,
                size: Math.random() * 1.5,
                alpha: Math.random(),
                speed: Math.random() * 0.02 + 0.005
            });
        }

        // Khởi tạo mưa sao băng rơi nhẹ
        const meteors = [];
        function createMeteor() {
            if (meteors.length < 3 && Math.random() < 0.01) {
                meteors.push({
                    x: Math.random() * width * 0.8,
                    y: 0,
                    length: Math.random() * 80 + 40,
                    speed: Math.random() * 4 + 3,
                    alpha: 1
                });
            }
        }

        let auroraTime = 0;

        function drawSky() {
            ctx.clearRect(0, 0, width, height);

            // 1. Vẽ các đốm sao lấp lánh bầu trời nền
            starsArray.forEach(star => {
                star.alpha += star.speed;
                if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(star.alpha)})`;
                ctx.fillRect(star.x, star.y, star.size, star.size);
            });

            // 2. KỸ THUẬT VẼ ĐỘNG DẢI CỰC QUANG (AURORA WAVE EFFECT)
            auroraTime += 0.004;
            ctx.save();
            for (let i = 0; i < 3; i++) { // Vẽ 3 dải sáng lồng vào nhau tạo chiều sâu
                ctx.beginPath();
                let gradient = ctx.createLinearGradient(0, 0, 0, height * 0.6);
                if (i === 0) {
                    gradient.addColorStop(0, 'rgba(72, 202, 228, 0)');
                    gradient.addColorStop(0.2, 'rgba(72, 202, 228, 0.15)');
                    gradient.addColorStop(0.5, 'rgba(14, 116, 144, 0)');
                } else if (i === 1) {
                    gradient.addColorStop(0.1, 'rgba(170, 240, 210, 0)');
                    gradient.addColorStop(0.35, 'rgba(72, 240, 180, 0.12)');
                    gradient.addColorStop(0.6, 'rgba(10, 36, 66, 0)');
                } else {
                    gradient.addColorStop(0.05, 'rgba(202, 240, 248, 0)');
                    gradient.addColorStop(0.3, 'rgba(202, 240, 248, 0.08)');
                    gradient.addColorStop(0.55, 'rgba(2, 11, 24, 0)');
                }

                ctx.fillStyle = gradient;

                // Tạo sóng gợn hình toán học Sin
                ctx.moveTo(0, height);
                for (let x = 0; x <= width; x += 10) {
                    let yShift = Math.sin(x * 0.003 + auroraTime + i * 1.5) * 45;
                    let yBase = height * 0.25 + i * 35;
                    ctx.lineTo(x, yBase + yShift);
                }
                ctx.lineTo(width, height);
                ctx.lineTo(0, height);
                ctx.fill();
            }
            ctx.restore();

            // 3. Vẽ hiệu ứng sao băng rớt nhẹ theo đường chéo góc
            createMeteor();
            meteors.forEach((meteor, index) => {
                meteor.x += meteor.speed;
                meteor.y += meteor.speed * 0.75; // Rơi góc nghiêng
                meteor.alpha -= 0.01;

                if (meteor.alpha <= 0 || meteor.x > width || meteor.y > height) {
                    meteors.splice(index, 1);
                } else {
                    ctx.save();
                    let msg = ctx.createLinearGradient(meteor.x, meteor.y, meteor.x - meteor.length, meteor.y - meteor.length * 0.75);
                    msg.addColorStop(0, `rgba(255, 255, 255, ${meteor.alpha})`);
                    msg.addColorStop(0.5, `rgba(72, 202, 228, ${meteor.alpha * 0.5})`);
                    msg.addColorStop(1, 'rgba(255, 255, 255, 0)');
                    ctx.strokeStyle = msg;
                    ctx.lineWidth = 1.5;
                    ctx.beginPath();
                    ctx.moveTo(meteor.x, meteor.y);
                    ctx.lineTo(meteor.x - meteor.length, meteor.y - meteor.length * 0.75);
                    ctx.stroke();
                    ctx.restore();
                }
            });

            requestAnimationFrame(drawSky);
        }
        drawSky();

        // --- CẤU HÌNH ĐỒNG BỘ REALTIME DATABASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyDaElInBGRcqhQnlSuKD0o5J0xIG37vCzs",
            authDomain: "aurora-d3f41.firebaseapp.com",
            databaseURL: "https://aurora-d3f41-default-rtdb.firebaseio.com/", 
            projectId: "aurora-d3f41",
            storageBucket: "aurora-d3f41.firebasestorage.app",
            messagingSenderId: "482410788559",
            appId: "1:482410788559:web:ae8a057761d09bbbf8e9ba",
            measurementId: "G-JEVSBQCLG9"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const memoriesRef = database.ref('aurora_stories'); 

        let memories = [];
        let currentPage = 0;
        let currentSlideIndex = 0;

        const bookPage = document.getElementById('bookPage');
        const sliderContainer = document.getElementById('sliderContainer');
        const displayImg = document.getElementById('displayImg');
        const displayText = document.getElementById('displayText');
        const displayAuthor = document.getElementById('displayAuthor');
        const pageIndicator = document.getElementById('pageIndicator');
        const sliderIndicator = document.getElementById('sliderIndicator');

        memoriesRef.on('value', (snapshot) => {
            const data = snapshot.val();
            memories = [];
            if (data) {
                Object.keys(data).forEach(key => { memories.push(data[key]); });
                currentPage = memories.length - 1; 
            }
            updateBook();
        });

        function updateBook() {
            if (memories.length === 0) {
                displayText.innerHTML = "Chưa có trang kí ức nào được viết.<br>Hãy là người đầu tiên thắp sáng Aurora!";
                displayAuthor.textContent = ""; sliderContainer.style.display = 'none';
                pageIndicator.textContent = "Trang 0 / 0"; return;
            }
            bookPage.style.opacity = 0;
            setTimeout(() => {
                const currentData = memories[currentPage];
                currentSlideIndex = 0;

                let images = [];
                if (currentData.imageUrls && Array.isArray(currentData.imageUrls)) {
                    images = currentData.imageUrls;
                } else if (currentData.imageUrl) {
                    images = [currentData.imageUrl];
                }

                if (images.length > 0) {
                    sliderContainer.style.display = 'block';
                    displayImg.src = images[currentSlideIndex];
                    sliderIndicator.textContent = `${currentSlideIndex + 1}/${images.length}`;
                    const sliderBtns = document.querySelectorAll('.slider-btn');
                    sliderBtns.forEach(btn => btn.style.display = images.length > 1 ? 'flex' : 'none');
                } else {
                    sliderContainer.style.display = 'none';
                }

                displayText.textContent = `"${currentData.text}"`;
                displayAuthor.textContent = `- ${currentData.author} -`;
                pageIndicator.textContent = `Trang ${currentPage + 1} / ${memories.length}`;
                bookPage.style.opacity = 1;
                document.querySelector('.page-text-container').scrollTop = 0;
            }, 300);
        }

        function changeSlide(direction) {
            const currentData = memories[currentPage];
            let images = currentData.imageUrls || [currentData.imageUrl];
            if (!images || images.length <= 1) return;

            currentSlideIndex += direction;
            if (currentSlideIndex >= images.length) currentSlideIndex = 0;
            if (currentSlideIndex < 0) currentSlideIndex = images.length - 1;

            displayImg.src = images[currentSlideIndex];
            sliderIndicator.textContent = `${currentSlideIndex + 1}/${images.length}`;
        }

        function turnPage(direction) {
            if (memories.length === 0) return;
            currentPage += direction;
            if (currentPage >= memories.length) currentPage = 0;
            if (currentPage < 0) currentPage = memories.length - 1;
            updateBook();
        }

        function openModal() { document.getElementById('inputModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('inputModal').style.display = 'none'; }

        function compressImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = function (e) {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        let width = img.width; let height = img.height;
                        if (width > height) { if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; } } 
                        else { if (height > maxHeight) { width = Math.round((width * maxHeight) / height); height = maxHeight; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => { resolve(blob); }, 'image/jpeg', quality);
                    };
                };
                reader.onerror = (err) => reject(err);
            });
        }

        document.getElementById('storyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const author = document.getElementById('author').value;
            const text = document.getElementById('story').value;
            const imageFiles = document.getElementById('imageUpload').files;
            
            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.disabled = true;

            try {
                let uploadedUrls = [];
                if (imageFiles.length > 0) {
                    const imgbbApiKey = '67089e16b65e21576b2419c114d01778'; 
                    for (let i = 0; i < imageFiles.length; i++) {
                        submitBtn.textContent = `Đang tải ảnh ${i+1}/${imageFiles.length}...`;
                        const compressedBlob = await compressImage(imageFiles[i], 1000, 1000, 0.75);
                        const formData = new FormData();
                        formData.append('image', compressedBlob, `compressed_${i}.jpg`); 
                        const response = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbApiKey}`, { method: 'POST', body: formData });
                        const imgData = await response.json();
                        if(imgData.success) { uploadedUrls.push(imgData.data.url); }
                    }
                }

                await memoriesRef.push({
                    author: author, text: text, imageUrls: uploadedUrls, timestamp: Date.now()
                });

                closeModal();
                document.getElementById('storyForm').reset();
            } catch (error) {
                console.error(error); alert("Có lỗi xảy ra: " + error.message);
            } finally {
                submitBtn.textContent = "Lưu vào sách"; submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
