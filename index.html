<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURORA - Hồi Ức 7 Năm</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:ital,wght@0,300;0,500;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        /* --- CSS STYLING --- */
        :root {
            --aurora-cyan: #48CAE4;
            --aurora-light: #CAF0F8;
            --bg-top: #020b18; 
            --bg-mid: #0a2442;
            --bg-bottom: #145973; 
            --accent-yellow: #FFD166; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
        }

        body {
            background: linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 40%, var(--bg-bottom) 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Hiệu ứng nền vũ trụ & ánh sáng cực quang */
        .stars {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: 
                radial-gradient(1px 1px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 70px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1px 1px at 50px 160px, var(--aurora-light), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 240px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 300px 80px, var(--aurora-cyan), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 260px 220px, #ffffff, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
            animation: twinkle 4s infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.5; }
            100% { opacity: 1; transform: scale(1.02); }
        }

        .lens-flare {
            position: absolute;
            top: 15%; left: 20%;
            width: 4px; height: 4px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px 10px rgba(255, 255, 255, 0.4),
                        0 0 40px 20px var(--aurora-cyan);
            z-index: 0;
            animation: pulse 3s infinite alternate;
        }
        
        .lens-flare::before, .lens-flare::after {
            content: ''; position: absolute; top: 50%; left: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: translate(-50%, -50%);
        }
        .lens-flare::before { width: 80px; height: 1px; }
        .lens-flare::after { width: 1px; height: 80px; }

        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        .landscape-bottom {
            position: fixed;
            bottom: 0; left: 0; width: 100%; height: 150px;
            background: linear-gradient(to top, #021a22, transparent);
            z-index: 0;
            pointer-events: none;
        }
        
        .fireflies {
            position: absolute; width: 100%; height: 100%;
            background-image: 
                radial-gradient(4px 4px at 10% 80%, var(--accent-yellow), transparent),
                radial-gradient(6px 6px at 25% 60%, var(--accent-yellow), transparent),
                radial-gradient(3px 3px at 40% 90%, var(--accent-yellow), transparent),
                radial-gradient(5px 5px at 70% 70%, var(--accent-yellow), transparent),
                radial-gradient(7px 7px at 85% 85%, var(--accent-yellow), transparent),
                radial-gradient(4px 4px at 95% 65%, var(--accent-yellow), transparent);
            background-repeat: no-repeat;
            filter: drop-shadow(0 0 5px var(--accent-yellow));
            animation: float-up 6s infinite ease-in-out alternate;
        }

        @keyframes float-up {
            0% { transform: translateY(0px); opacity: 0.7; }
            100% { transform: translateY(-15px); opacity: 1; }
        }

        /* Header */
        header {
            text-align: center;
            margin-top: 40px;
            z-index: 1;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 6.5rem;
            color: #ffffff;
            font-weight: normal;
            line-height: 1;
            text-shadow: 
                0 0 10px rgba(255, 255, 255, 0.8), 
                0 0 20px var(--aurora-cyan), 
                0 0 40px var(--aurora-cyan), 
                0 0 80px rgba(72, 202, 228, 0.6);
            margin-bottom: 5px;
            letter-spacing: 5px;
        }

        header p {
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--aurora-light);
            text-shadow: 0 0 10px rgba(202, 240, 248, 0.5);
            line-height: 1.6;
        }

        /* Cuốn sách Hologram */
        .book-wrapper {
            position: relative;
            width: 90%;
            max-width: 800px;
            margin: 30px auto;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .book-page {
            background: rgba(10, 36, 66, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(72, 202, 228, 0.4);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            min-height: 400px;
            box-shadow: 0 0 40px rgba(72, 202, 228, 0.15), inset 0 0 20px rgba(202, 240, 248, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transition: opacity 0.5s ease-in-out;
        }

        .page-img {
            max-width: 80%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 2px solid rgba(255,255,255,0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            display: none;
        }

        .page-text {
            font-size: 1.25rem;
            line-height: 1.7;
            margin-bottom: 20px;
            font-style: italic;
            color: #f8f9fa;
            white-space: pre-wrap;
        }

        .page-author {
            font-size: 1.1rem;
            color: var(--accent-yellow);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(255, 209, 102, 0.4);
        }

        /* Nút lật trang */
        .nav-btn {
            background: rgba(72, 202, 228, 0.1);
            border: 1px solid rgba(72, 202, 228, 0.3);
            color: var(--aurora-light);
            width: 50px; height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            position: absolute;
            top: 50%; transform: translateY(-50%);
            transition: all 0.3s;
            display: flex; justify-content: center; align-items: center;
            z-index: 3;
        }
        .nav-btn:hover {
            background: rgba(72, 202, 228, 0.3);
            box-shadow: 0 0 20px var(--aurora-cyan);
            color: #fff;
        }
        .prev-btn { left: -25px; }
        .next-btn { right: -25px; }

        .page-indicator {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--aurora-light);
            opacity: 0.7;
            z-index: 2;
        }

        /* Nút viết bài */
        .add-btn {
            margin-top: 20px;
            background: transparent;
            color: var(--aurora-light);
            font-weight: 600;
            padding: 12px 30px;
            border: 2px solid var(--aurora-cyan);
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            z-index: 2;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .add-btn:hover {
            background: rgba(72, 202, 228, 0.2);
            box-shadow: 0 0 25px rgba(72, 202, 228, 0.6);
            color: #fff;
        }

        /* Modal Popup */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(2, 11, 24, 0.85);
            backdrop-filter: blur(8px);
            z-index: 10;
            justify-content: center; align-items: center;
        }

        .modal-content {
            background: var(--bg-mid);
            padding: 30px;
            border-radius: 15px;
            width: 90%; max-width: 500px;
            border: 1px solid var(--aurora-cyan);
            box-shadow: 0 0 30px rgba(72, 202, 228, 0.2);
        }
        .modal-content h2 { margin-bottom: 20px; color: var(--accent-yellow); text-align: center;}
        input, textarea { 
            width: 100%; padding: 12px; margin-bottom: 15px; 
            border-radius: 8px; border: 1px solid rgba(72, 202, 228, 0.3); 
            background: rgba(0,0,0,0.3); color: #fff; outline: none;
        }
        input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.4); }
        input:focus, textarea:focus { border-color: var(--aurora-cyan); box-shadow: 0 0 10px rgba(72, 202, 228, 0.2); }
        input[type="file"] { padding: 8px; color: rgba(255,255,255,0.7); }
        
        .modal-actions { display: flex; justify-content: space-between; gap: 15px; }
        .cancel-btn { flex: 1; background: transparent; color: #fff; padding: 10px; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; cursor: pointer; transition: 0.3s;}
        .cancel-btn:hover { background: rgba(255,255,255,0.1); }
        .submit-btn { flex: 1; background: var(--aurora-cyan); color: #020b18; padding: 10px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; transition: 0.3s;}
        .submit-btn:hover { box-shadow: 0 0 15px var(--aurora-cyan); }
    </style>
</head>
<body>

    <div class="stars"></div>
    <div class="lens-flare"></div>
    <div class="landscape-bottom">
        <div class="fireflies"></div>
    </div>

    <header>
        <h1>Aurora</h1>
        <p>Lễ kỉ niệm 7 năm thành lập<br>Đội SVTN Đồng hương Nghệ Tĩnh - ĐHBK Hà Nội</p>
    </header>

    <div class="book-wrapper">
        <button class="nav-btn prev-btn" onclick="turnPage(-1)">&#10094;</button>
        
        <div class="book-page" id="bookPage">
            <img src="" id="displayImg" class="page-img" alt="Ký ức">
            <div id="displayText" class="page-text">Chưa có trang kí ức nào được viết.<br>Hãy là người đầu tiên thắp sáng Aurora!</div>
            <div id="displayAuthor" class="page-author"></div>
        </div>

        <button class="nav-btn next-btn" onclick="turnPage(1)">&#10095;</button>
    </div>

    <div class="page-indicator" id="pageIndicator">Trang 0 / 0</div>

    <button class="add-btn" onclick="openModal()">Viết Trang Mới</button>

    <div class="modal" id="inputModal">
        <div class="modal-content">
            <h2>Gửi gắm kí ức</h2>
            <form id="storyForm">
                <input type="text" id="author" placeholder="Tên hoặc biệt danh..." required>
                <textarea id="story" rows="4" placeholder="Kể lại kỉ niệm, hoặc gửi lời chúc..." required></textarea>
                <input type="file" id="imageUpload" accept="image/*">
                <div class="modal-actions">
                    <button type="button" class="cancel-btn" onclick="closeModal()">Hủy</button>
                    <button type="submit" class="submit-btn">Lưu vào sách</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

    <script>
        // --- 1. CẤU HÌNH FIREBASE DATABASE ĐẦY ĐỦ CHÍNH CHỦ ---
        const firebaseConfig = {
            apiKey: "AIzaSyDaElInBGRcqhQnlSuKD0o5J0xIG37vCzs",
            authDomain: "aurora-d3f41.firebaseapp.com",
            databaseURL: "https://aurora-d3f41-default-rtdb.firebaseio.com/", 
            projectId: "aurora-d3f41",
            storageBucket: "aurora-d3f41.firebasestorage.app",
            messagingSenderId: "482410788559",
            appId: "1:482410788559:web:ae8a057761d09bbbf8e9ba",
            measurementId: "G-JEVSBQCLG9"
        };

        // Khởi tạo Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const memoriesRef = database.ref('aurora_stories'); 

        // --- 2. LOGIC ĐỒNG BỘ REALTIME VÀ LẬT SÁCH ---
        let memories = [];
        let currentPage = 0;

        const bookPage = document.getElementById('bookPage');
        const displayImg = document.getElementById('displayImg');
        const displayText = document.getElementById('displayText');
        const displayAuthor = document.getElementById('displayAuthor');
        const pageIndicator = document.getElementById('pageIndicator');

        // Lắng nghe dữ liệu thời gian thực từ database
        memoriesRef.on('value', (snapshot) => {
            const data = snapshot.val();
            memories = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    memories.push(data[key]);
                });
                currentPage = memories.length - 1; // Nhảy ngay tới trang mới gửi
            }
            updateBook();
        });

        function updateBook() {
            if (memories.length === 0) {
                displayText.innerHTML = "Chưa có trang kí ức nào được viết.<br>Hãy là người đầu tiên thắp sáng Aurora!";
                displayAuthor.textContent = "";
                displayImg.style.display = 'none';
                pageIndicator.textContent = "Trang 0 / 0";
                return;
            }
            bookPage.style.opacity = 0;
            setTimeout(() => {
                const currentData = memories[currentPage];
                if (currentData.imageUrl) {
                    displayImg.src = currentData.imageUrl;
                    displayImg.style.display = 'block';
                } else {
                    displayImg.style.display = 'none';
                }
                displayText.textContent = `"${currentData.text}"`;
                displayAuthor.textContent = `- ${currentData.author} -`;
                pageIndicator.textContent = `Trang ${currentPage + 1} / ${memories.length}`;
                bookPage.style.opacity = 1;
            }, 300);
        }

        function turnPage(direction) {
            if (memories.length === 0) return;
            currentPage += direction;
            if (currentPage >= memories.length) currentPage = 0;
            if (currentPage < 0) currentPage = memories.length - 1;
            updateBook();
        }

        function openModal() { document.getElementById('inputModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('inputModal').style.display = 'none'; }

        // --- HÀM NÉN ẢNH SIÊU TỐC ĐỘ (HTML5 CANVAS) ---
        function compressImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function (e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function () {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxWidth) {
                                height = Math.round((height * maxWidth) / width);
                                width = maxWidth;
                            }
                        } else {
                            if (height > maxHeight) {
                                width = Math.round((width * maxHeight) / height);
                                height = maxHeight;
                            }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        canvas.toBlob((blob) => {
                            resolve(blob);
                        }, 'image/jpeg', quality);
                    };
                };
                reader.onerror = (err) => reject(err);
            });
        }

        // --- LOGIC GỬI HỒI ỨC AN TOÀN & TỐC ĐỘ CAO ---
        document.getElementById('storyForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const author = document.getElementById('author').value;
            const text = document.getElementById('story').value;
            const imageFile = document.getElementById('imageUpload').files[0];
            
            const submitBtn = document.querySelector('.submit-btn');
            submitBtn.textContent = "Đang tải lên vũ trụ...";
            submitBtn.disabled = true;

            try {
                let downloadUrl = null;
                
                // Gửi ảnh qua ImgBB sau khi đã co nén siêu nhẹ
                if (imageFile) {
                    // Tự động nén ảnh về kích thước tối đa 1000px, chất lượng 75% ngay tại máy user
                    const compressedBlob = await compressImage(imageFile, 1000, 1000, 0.75);
                    
                    const imgbbApiKey = '67089e16b65e21576b2419c114d01778'; 
                    const formData = new FormData();
                    formData.append('image', compressedBlob, 'compressed.jpg'); 
                    
                    const response = await fetch(`https://api.imgbb.com/1/upload?key=${imgbbApiKey}`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const imgData = await response.json();
                    
                    if(imgData.success) {
                        downloadUrl = imgData.data.url; 
                    } else {
                        throw new Error("Không tải được ảnh, b thử lại tệp khác nha!");
                    }
                }

                // Lưu text và link ảnh đồng bộ trực tiếp lên Firebase Realtime Database
                await memoriesRef.push({
                    author: author,
                    text: text,
                    imageUrl: downloadUrl,
                    timestamp: Date.now()
                });

                closeModal();
                document.getElementById('storyForm').reset();

            } catch (error) {
                console.error(error);
                alert("Có lỗi xảy ra: " + error.message + "\nB nhớ chắc chắn đã lưu Rules Database thành true trên console nha!");
            } finally {
                // Khối bảo hiểm luôn nhả nút về trạng thái cũ nếu có lỗi hệ thống xảy ra
                submitBtn.textContent = "Lưu vào sách";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
